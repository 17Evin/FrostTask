
<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Work - Frost Task</title>

    <style>

        /* =========================
           RESET
        ========================= */

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background:
                linear-gradient(
                    135deg,
                    #eaf8ff,
                    #f7fcff
                );
            color: #17324d;
            min-height: 100vh;
            line-height: 1.5;
        }


        /* =========================
           HEADER
        ========================= */

        header {
            background: rgba(255, 255, 255, 0.92);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);

            padding: 18px 30px;

            display: flex;
            justify-content: space-between;
            align-items: center;

            border-bottom: 1px solid #cfeaf7;

            box-shadow:
                0 5px 20px
                rgba(60, 140, 180, 0.10);

            position: sticky;
            top: 0;
            z-index: 100;
        }


        .logo {
            font-size: 26px;
            font-weight: 800;
            color: #168dcc;
            white-space: nowrap;
        }


        /* =========================
           NAVIGATION
        ========================= */

        nav {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            flex-wrap: wrap;
        }


        nav a {
            text-decoration: none;
            color: #31566f;

            padding: 9px 13px;

            border-radius: 10px;

            font-size: 14px;
            font-weight: 600;

            transition:
                background 0.2s ease,
                color 0.2s ease,
                transform 0.2s ease;
        }


        nav a:hover {
            background: #e3f6ff;
            color: #087db6;
            transform: translateY(-1px);
        }


        nav a.active {
            background: #dff4ff;
            color: #087db6;
        }


        /* =========================
           CONTAINER
        ========================= */

        .container {
            width: min(1100px, 92%);
            margin: 35px auto 60px;
        }


        /* =========================
           PAGE TITLE
        ========================= */

        .page-title {
            margin-bottom: 28px;
        }


        .page-title h2 {
            font-size: 34px;
            color: #17324d;
            margin-bottom: 7px;
        }


        .page-title p {
            color: #6b879b;
            font-size: 15px;
        }


        /* =========================
           CARD
        ========================= */

        .card {
            background: rgba(255, 255, 255, 0.90);

            border:
                1px solid #d4edf8;

            border-radius: 20px;

            padding: 24px;

            margin-bottom: 22px;

            box-shadow:
                0 10px 30px
                rgba(60, 140, 180, 0.10);

            transition:
                transform 0.2s ease,
                box-shadow 0.2s ease;
        }


        .card h3 {
            color: #17324d;
            font-size: 20px;
            margin-bottom: 19px;
        }


        /* =========================
           FORM
        ========================= */

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
        }


        .form-group {
            display: flex;
            flex-direction: column;
        }


        .form-group.full {
            grid-column: 1 / -1;
        }


        label {
            display: block;

            margin-bottom: 7px;

            font-weight: 700;

            font-size: 14px;

            color: #31566f;
        }


        input,
        textarea {
            width: 100%;

            padding: 12px 13px;

            border:
                1px solid #c9e5f3;

            border-radius: 11px;

            outline: none;

            font-family: inherit;

            font-size: 15px;

            color: #17324d;

            background: #fafdff;

            transition:
                border-color 0.2s ease,
                box-shadow 0.2s ease,
                background 0.2s ease;
        }


        input:hover,
        textarea:hover {
            border-color: #a9d9ec;
        }


        input:focus,
        textarea:focus {
            border-color: #43b7eb;

            background: white;

            box-shadow:
                0 0 0 3px
                rgba(67, 183, 235, 0.12);
        }


        input::placeholder,
        textarea::placeholder {
            color: #9aafbd;
        }


        textarea {
            resize: vertical;
            min-height: 90px;
        }


        /* =========================
           BUTTONS
        ========================= */

        button {
            border: none;

            cursor: pointer;

            border-radius: 10px;

            padding: 11px 18px;

            font-family: inherit;

            font-size: 14px;

            font-weight: 700;

            transition:
                background 0.2s ease,
                transform 0.2s ease,
                box-shadow 0.2s ease;
        }


        button:hover {
            transform: translateY(-1px);
        }


        button:active {
            transform: translateY(0);
        }


        button:focus-visible {
            outline:
                3px solid
                rgba(67, 183, 235, 0.25);

            outline-offset: 2px;
        }


        .primary-btn {
            background: #43b7eb;
            color: white;
            margin-top: 18px;
        }


        .primary-btn:hover {
            background: #168dcc;

            box-shadow:
                0 5px 12px
                rgba(22, 141, 204, 0.18);
        }


        .cancel-btn {
            background: #e8f5fa;
            color: #31566f;

            margin-top: 18px;
            margin-left: 8px;
        }


        .cancel-btn:hover {
            background: #d8edf5;
        }


        /* =========================
           SUMMARY
        ========================= */

        .summary {
            display: grid;

            grid-template-columns:
                repeat(3, 1fr);

            gap: 16px;
        }


        .summary-box {
            background:
                rgba(255, 255, 255, 0.92);

            border:
                1px solid #d4edf8;

            border-radius: 18px;

            padding: 21px;

            text-align: center;

            box-shadow:
                0 8px 25px
                rgba(60, 140, 180, 0.08);

            transition:
                transform 0.2s ease,
                box-shadow 0.2s ease;
        }


        .summary-box:hover {
            transform: translateY(-2px);

            box-shadow:
                0 12px 28px
                rgba(60, 140, 180, 0.12);
        }


        .summary-box h4 {
            color: #7892a3;

            margin-bottom: 8px;

            font-size: 14px;
        }


        .summary-box strong {
            font-size: 27px;
            color: #168dcc;
        }


        /* =========================
           PROGRESS
        ========================= */

        .progress-container {
            margin-top: 20px;
        }


        .progress-header {
            display: flex;
            justify-content: space-between;
            align-items: center;

            margin-bottom: 8px;

            color: #31566f;

            font-size: 14px;
            font-weight: 700;
        }


        .progress-bar {
            width: 100%;

            height: 15px;

            background: #e5f4fb;

            border-radius: 20px;

            overflow: hidden;
        }


        .progress-fill {
            height: 100%;

            width: 0%;

            background:
                linear-gradient(
                    90deg,
                    #43b7eb,
                    #8ddcff
                );

            border-radius: 20px;

            transition:
                width 0.4s ease;
        }


        .progress-text {
            margin-top: 8px;

            color: #7892a3;

            font-size: 14px;
        }


        /* =========================
           WORK LIST
        ========================= */

        .work-list {
            display: grid;
            gap: 14px;
        }


        .work-item {
            border:
                1px solid #d9edf7;

            border-radius: 16px;

            padding: 18px;

            background:
                linear-gradient(
                    135deg,
                    #fbfeff,
                    #f5fbfe
                );

            transition:
                border-color 0.2s ease,
                transform 0.2s ease,
                box-shadow 0.2s ease;
        }


        .work-item:hover {
            border-color: #b9e2f2;

            transform: translateY(-1px);

            box-shadow:
                0 7px 18px
                rgba(60, 140, 180, 0.08);
        }


        .work-item.completed {
            background:
                linear-gradient(
                    135deg,
                    #f4fcf7,
                    #fbfffc
                );

            border-color: #cbe6d5;
        }


        .work-item.overdue {
            border-color: #efc6c6;

            background:
                linear-gradient(
                    135deg,
                    #fffafa,
                    #fff5f5
                );
        }


        .work-top {
            display: flex;

            justify-content: space-between;

            align-items: flex-start;

            gap: 15px;
        }


        .task-info {
            flex: 1;
            min-width: 0;
        }


        .task-name {
            font-size: 19px;

            font-weight: 700;

            color: #17324d;

            margin-bottom: 8px;

            word-break: break-word;
        }


        .completed .task-name {
            text-decoration: line-through;

            color: #76909c;
        }


        .deadline {
            color: #6b879b;

            font-size: 14px;

            margin-bottom: 7px;

            word-break: break-word;
        }


        /* =========================
           STATUS
        ========================= */

        .status {
            display: inline-block;

            padding: 5px 10px;

            border-radius: 15px;

            font-size: 12px;

            font-weight: 700;

            margin-top: 5px;
        }


        .status.upcoming {
            background: #e1f4fb;
            color: #176b87;
        }


        .status.today {
            background: #fff3d7;
            color: #946c00;
        }


        .status.overdue {
            background: #ffe5e5;
            color: #b23b3b;
        }


        .status.completed {
            background: #dff4e5;
            color: #287442;
        }


        /* =========================
           NOTES
        ========================= */

        .notes {
            margin-top: 12px;

            color: #6b879b;

            font-size: 14px;

            white-space: pre-wrap;

            word-break: break-word;
        }


        /* =========================
           ACTION BUTTONS
        ========================= */

        .actions {
            display: flex;

            flex-wrap: wrap;

            gap: 8px;

            margin-top: 16px;
        }


        .complete-btn {
            background: #dff4e5;
            color: #287442;
        }


        .complete-btn:hover {
            background: #cdebd7;
        }


        .edit-btn {
            background: #e3f3fa;
            color: #176b87;
        }


        .edit-btn:hover {
            background: #d4edf6;
        }


        .delete-btn {
            background: #ffe5e5;
            color: #b23b3b;
        }


        .delete-btn:hover {
            background: #ffd5d5;
        }


        /* =========================
           EMPTY STATE
        ========================= */

        .empty {
            text-align: center;

            padding: 35px 15px;

            color: #7892a3;

            font-size: 14px;

            line-height: 1.7;
        }


        /* =========================
           RESPONSIVE
        ========================= */

        @media (max-width: 850px) {

            header {
                flex-direction: column;

                gap: 14px;

                padding: 18px;
            }


            nav {
                width: 100%;
            }


            nav a {
                padding: 8px 10px;
                font-size: 13px;
            }


            .container {
                width: 94%;
                margin-top: 28px;
            }

        }


        @media (max-width: 700px) {

            .page-title h2 {
                font-size: 29px;
            }


            .form-grid {
                grid-template-columns: 1fr;
            }


            .form-group.full {
                grid-column: auto;
            }


            .summary {
                grid-template-columns: 1fr;
            }


            .work-top {
                flex-direction: column;
            }


            .card {
                padding: 19px;

                border-radius: 17px;
            }

        }


        @media (max-width: 430px) {

            header {
                padding: 15px 12px;
            }


            .logo {
                font-size: 23px;
            }


            nav {
                gap: 3px;
            }


            nav a {
                padding: 7px 8px;
                font-size: 12px;
            }


            .container {
                width: 94%;
                margin-top: 22px;
            }


            .page-title h2 {
                font-size: 26px;
            }


            .page-title p {
                font-size: 14px;
            }


            .actions button {
                flex: 1;
            }

        }

    </style>

</head>


<body>


<header>

    <div class="logo">
        ❄️ Frost Task
    </div>


    <nav>

        <a href="index.html">
            Dashboard
        </a>

        <a href="weekly.html">
            Weekly
        </a>

        <a href="finance.html">
            Finance
        </a>

        <a href="savings.html">
            Savings
        </a>

        <a href="work.html" class="active">
            Work
        </a>

        <a href="alerts.html">
            Alerts
        </a>

    </nav>

</header>


<div class="container">


    <!-- PAGE TITLE -->

    <div class="page-title">

        <h2>
            💼 Work Bar
        </h2>

        <p>
            Manage your work tasks and deadlines.
        </p>

    </div>


    <!-- ADD / EDIT TASK -->

    <div class="card">

        <h3 id="formTitle">
            ➕ Add Work Task
        </h3>


        <div class="form-grid">


            <div class="form-group full">

                <label for="taskName">
                    Task Name
                </label>

                <input
                    type="text"
                    id="taskName"
                    placeholder="Enter your work task"
                    maxlength="150"
                >

            </div>


            <div class="form-group">

                <label for="deadlineDate">
                    Deadline Date
                </label>

                <input
                    type="date"
                    id="deadlineDate"
                >

            </div>


            <div class="form-group">

                <label for="deadlineTime">
                    Deadline Time
                </label>

                <input
                    type="time"
                    id="deadlineTime"
                >

            </div>


            <div class="form-group full">

                <label for="taskNotes">
                    Notes
                </label>

                <textarea
                    id="taskNotes"
                    placeholder="Optional notes..."
                    maxlength="1000"
                ></textarea>

            </div>

        </div>


        <button
            type="button"
            class="primary-btn"
            id="saveButton"
            onclick="saveWorkTask()"
        >
            Add Work Task
        </button>


        <button
            type="button"
            class="cancel-btn"
            id="cancelButton"
            onclick="cancelEdit()"
            style="display: none;"
        >
            Cancel
        </button>

    </div>


    <!-- WORK PROGRESS -->

    <div class="card">

        <h3>
            📊 Work Progress
        </h3>


        <div class="summary">


            <div class="summary-box">

                <h4>
                    Total Tasks
                </h4>

                <strong id="totalTasks">
                    0
                </strong>

            </div>


            <div class="summary-box">

                <h4>
                    Completed
                </h4>

                <strong id="completedTasks">
                    0
                </strong>

            </div>


            <div class="summary-box">

                <h4>
                    Pending
                </h4>

                <strong id="pendingTasks">
                    0
                </strong>

            </div>


        </div>


        <div class="progress-container">

            <div class="progress-header">

                <span>
                    Completion Progress
                </span>

                <span id="progressText">
                    0%
                </span>

            </div>


            <div class="progress-bar">

                <div
                    class="progress-fill"
                    id="progressFill"
                ></div>

            </div>


        </div>

    </div>


    <!-- WORK TASK LIST -->

    <div class="card">

        <h3>
            📋 Work Tasks
        </h3>


        <div
            id="workList"
            class="work-list"
        ></div>

    </div>


</div>


<script>

    /* =========================
       STORAGE
    ========================= */

    const STORAGE_KEY =
        "frostWorkTasks";


    let workTasks =
        JSON.parse(
            localStorage.getItem(
                STORAGE_KEY
            )
        ) || [];


    let editingIndex = -1;


    /* =========================
       SAVE DATA
    ========================= */

    function saveData() {

        localStorage.setItem(
            STORAGE_KEY,
            JSON.stringify(
                workTasks
            )
        );

    }


    /* =========================
       SAVE / UPDATE TASK
    ========================= */

    function saveWorkTask() {

        const name =
            document
                .getElementById("taskName")
                .value
                .trim();


        const date =
            document
                .getElementById("deadlineDate")
                .value;


        const time =
            document
                .getElementById("deadlineTime")
                .value;


        const notes =
            document
                .getElementById("taskNotes")
                .value
                .trim();


        if (!name) {

            alert(
                "Please enter a task name."
            );

            return;
        }


        if (!date) {

            alert(
                "Please select a deadline date."
            );

            return;
        }


        const task = {

            name: name,

            deadlineDate: date,

            deadlineTime: time,

            notes: notes,

            completed:
                editingIndex >= 0
                    ? Boolean(
                        workTasks[
                            editingIndex
                        ]?.completed
                    )
                    : false

        };


        if (editingIndex >= 0) {

            workTasks[
                editingIndex
            ] = task;

            editingIndex = -1;

        } else {

            workTasks.push(
                task
            );

        }


        saveData();

        clearForm();

        renderWorkTasks();

    }


    /* =========================
       EDIT TASK
    ========================= */

    function editWorkTask(index) {

        if (
            !Number.isInteger(index) ||
            !workTasks[index]
        ) {
            return;
        }


        const task =
            workTasks[index];


        document.getElementById(
            "taskName"
        ).value =
            task.name || "";


        document.getElementById(
            "deadlineDate"
        ).value =
            task.deadlineDate || "";


        document.getElementById(
            "deadlineTime"
        ).value =
            task.deadlineTime || "";


        document.getElementById(
            "taskNotes"
        ).value =
            task.notes || "";


        editingIndex =
            index;


        document.getElementById(
            "formTitle"
        ).textContent =
            "✏️ Edit Work Task";


        document.getElementById(
            "saveButton"
        ).textContent =
            "Update Work Task";


        document.getElementById(
            "cancelButton"
        ).style.display =
            "inline-block";


        window.scrollTo({

            top: 0,

            behavior: "smooth"

        });

    }


    /* =========================
       CANCEL EDIT
    ========================= */

    function cancelEdit() {

        editingIndex = -1;

        clearForm();

    }


    /* =========================
       CLEAR FORM
    ========================= */

    function clearForm() {

        document.getElementById(
            "taskName"
        ).value = "";


        document.getElementById(
            "deadlineDate"
        ).value = "";


        document.getElementById(
            "deadlineTime"
        ).value = "";


        document.getElementById(
            "taskNotes"
        ).value = "";


        document.getElementById(
            "formTitle"
        ).textContent =
            "➕ Add Work Task";


        document.getElementById(
            "saveButton"
        ).textContent =
            "Add Work Task";


        document.getElementById(
            "cancelButton"
        ).style.display =
            "none";

    }


    /* =========================
       COMPLETE TASK
    ========================= */

    function toggleComplete(index) {

        if (
            !Number.isInteger(index) ||
            !workTasks[index]
        ) {
            return;
        }


        workTasks[index].completed =
            !Boolean(
                workTasks[index].completed
            );


        saveData();

        renderWorkTasks();

    }


    /* =========================
       DELETE TASK
    ========================= */

    function deleteWorkTask(index) {

        if (
            !Number.isInteger(index) ||
            !workTasks[index]
        ) {
            return;
        }


        const confirmed =
            confirm(
                "Are you sure you want to delete this work task?"
            );


        if (!confirmed) {
            return;
        }


        workTasks.splice(
            index,
            1
        );


        if (
            editingIndex === index
        ) {

            editingIndex = -1;

            clearForm();

        } else if (
            editingIndex > index
        ) {

            editingIndex--;

        }


        saveData();

        renderWorkTasks();

    }


    /* =========================
       DEADLINE STATUS
    ========================= */

    function getDeadlineStatus(task) {

        if (
            task.completed
        ) {

            return {

                text: "Completed",

                className: "completed"

            };

        }


        const deadline =
            new Date(
                task.deadlineDate +
                "T" +
                (
                    task.deadlineTime ||
                    "23:59"
                )
            );


        const now =
            new Date();


        if (
            deadline < now
        ) {

            return {

                text: "Overdue",

                className: "overdue"

            };

        }


        const today =
            new Date();


        today.setHours(
            0,
            0,
            0,
            0
        );


        const deadlineDay =
            new Date(
                task.deadlineDate +
                "T00:00:00"
            );


        deadlineDay.setHours(
            0,
            0,
            0,
            0
        );


        if (
            deadlineDay.getTime() ===
            today.getTime()
        ) {

            return {

                text: "Due Today",

                className: "today"

            };

        }


        return {

            text: "Upcoming",

            className: "upcoming"

        };

    }


    /* =========================
       FORMAT DEADLINE
    ========================= */

    function formatDeadline(task) {

        const date =
            new Date(
                task.deadlineDate +
                "T00:00:00"
            );


        if (
            Number.isNaN(
                date.getTime()
            )
        ) {

            return "Invalid date";

        }


        const dateText =
            date.toLocaleDateString(
                "en-IN",
                {
                    day: "2-digit",
                    month: "short",
                    year: "numeric"
                }
            );


        if (
            task.deadlineTime
        ) {

            const timeDate =
                new Date(
                    "2000-01-01T" +
                    task.deadlineTime
                );


            const timeText =
                timeDate.toLocaleTimeString(
                    "en-IN",
                    {
                        hour: "2-digit",
                        minute: "2-digit"
                    }
                );


            return (
                dateText +
                " at " +
                timeText
            );

        }


        return dateText;

    }


    /* =========================
       ESCAPE HTML
    ========================= */

    function escapeHTML(text) {

        const div =
            document.createElement(
                "div"
            );


        div.textContent =
            String(text ?? "");


        return div.innerHTML;

    }


    /* =========================
       RENDER TASKS
    ========================= */

    function renderWorkTasks() {

        const list =
            document.getElementById(
                "workList"
            );


        if (
            workTasks.length === 0
        ) {

            list.innerHTML = `

                <div class="empty">

                    💼 No work tasks yet.<br>

                    Add your first work task above.

                </div>

            `;


            updateProgress();

            return;

        }


        /*
            Create indexed copy so that
            sorting does not change the
            original localStorage order.
        */

        const indexedTasks =
            workTasks.map(
                (
                    task,
                    index
                ) => ({

                    task,

                    index

                })
            );


        /*
            Incomplete tasks first.
            Then sort by deadline.
        */

        indexedTasks.sort(
            (
                a,
                b
            ) => {

                if (
                    Boolean(
                        a.task.completed
                    ) !==
                    Boolean(
                        b.task.completed
                    )
                ) {

                    return a.task.completed
                        ? 1
                        : -1;

                }


                const dateA =
                    new Date(
                        a.task.deadlineDate +
                        "T" +
                        (
                            a.task.deadlineTime ||
                            "23:59"
                        )
                    );


                const dateB =
                    new Date(
                        b.task.deadlineDate +
                        "T" +
                        (
                            b.task.deadlineTime ||
                            "23:59"
                        )
                    );


                return (
                    dateA - dateB
                );

            }
        );


        list.innerHTML =
            indexedTasks
                .map(
                    ({
                        task,
                        index
                    }) => {

                        const status =
                            getDeadlineStatus(
                                task
                            );


                        const itemClass =
                            task.completed
                                ? "completed"
                                : status.className ===
                                  "overdue"
                                    ? "overdue"
                                    : "";


                        return `

                            <div
                                class="
                                    work-item
                                    ${itemClass}
                                "
                            >

                                <div
                                    class="work-top"
                                >

                                    <div
                                        class="task-info"
                                    >

                                        <div
                                            class="task-name"
                                        >
                                            ${escapeHTML(
                                                task.name
                                            )}
                                        </div>


                                        <div
                                            class="deadline"
                                        >
                                            🗓️ Deadline:
                                            ${formatDeadline(
                                                task
                                            )}
                                        </div>


                                        <span
                                            class="
                                                status
                                                ${status.className}
                                            "
                                        >
                                            ${status.text}
                                        </span>


                                        ${
                                            task.notes
                                                ? `

                                                    <div
                                                        class="notes"
                                                    >
                                                        📝
                                                        ${escapeHTML(
                                                            task.notes
                                                        )}
                                                    </div>

                                                `
                                                : ""
                                        }

                                    </div>

                                </div>


                                <div
                                    class="actions"
                                >

                                    <button
                                        type="button"
                                        class="complete-btn"
                                        onclick="
                                            toggleComplete(
                                                ${index}
                                            )
                                        "
                                    >
                                        ${
                                            task.completed
                                                ? "↩ Mark Pending"
                                                : "✓ Complete"
                                        }
                                    </button>


                                    <button
                                        type="button"
                                        class="edit-btn"
                                        onclick="
                                            editWorkTask(
                                                ${index}
                                            )
                                        "
                                    >
                                        ✏️ Edit
                                    </button>


                                    <button
                                        type="button"
                                        class="delete-btn"
                                        onclick="
                                            deleteWorkTask(
                                                ${index}
                                            )
                                        "
                                    >
                                        🗑️ Delete
                                    </button>

                                </div>

                            </div>

                        `;

                    }
                )
                .join("");


        updateProgress();

    }


    /* =========================
       UPDATE PROGRESS
    ========================= */

    function updateProgress() {

        const total =
            workTasks.length;


        const completed =
            workTasks.filter(
                task =>
                    Boolean(
                        task.completed
                    )
            ).length;


        const pending =
            total -
            completed;


        const percentage =
            total === 0
                ? 0
                : Math.round(
                    (
                        completed /
                        total
                    ) * 100
                );


        document.getElementById(
            "totalTasks"
        ).textContent =
            total;


        document.getElementById(
            "completedTasks"
        ).textContent =
            completed;


        document.getElementById(
            "pendingTasks"
        ).textContent =
            pending;


        document.getElementById(
            "progressFill"
        ).style.width =
            percentage + "%";


        document.getElementById(
            "progressText"
        ).textContent =
            percentage +
            "% completed";

    }


    /* =========================
       INITIAL LOAD
    ========================= */

    renderWorkTasks();

</script>

</body>
</html>
